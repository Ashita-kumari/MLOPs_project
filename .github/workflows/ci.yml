name: MLOps CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - name: Lint
        run: ruff check src tests scripts
      - name: Unit tests
        run: pytest -v
      - name: Download dataset
        run: python scripts/download_data.py
      - name: Generate EDA
        run: python scripts/run_eda.py
      - name: Train and track models
        run: python scripts/train_model.py
      - name: Build serving image
        run: docker build -t heart-disease-mlops:ci .
      - name: Smoke test container API
        run: |
          docker run -d --name heart-disease-api -p 8000:8000 heart-disease-mlops:ci
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 --retry-max-time 30 http://127.0.0.1:8000/health
          curl --fail http://127.0.0.1:8000/metrics
          curl --fail -X POST http://127.0.0.1:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"age":63,"sex":1,"cp":1,"trestbps":145,"chol":233,"fbs":1,"restecg":0,"thalach":150,"exang":0,"oldpeak":2.3,"slope":0,"ca":0,"thal":1}'
      - name: Container logs
        if: always()
        run: docker logs heart-disease-api || true
      - name: Remove test container
        if: always()
        run: docker rm -f heart-disease-api || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlops-run-artifacts
          path: |
            artifacts/
            mlruns/
            models/heart_disease_pipeline.joblib
          if-no-files-found: warn